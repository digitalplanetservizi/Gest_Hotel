<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-out — Wireframe</title>
<link rel="stylesheet" href="../assets/css/wireframe.css">
</head>
<body class="wireframe min-h-screen" data-page="planning">
<main class="p-6 max-w-xl mx-auto">
    <h1 class="text-xl font-bold mb-4">Check-out — conto e pagamento</h1>
    <div class="wf-annotation mb-4">Parziale: camera già pagata · righe extra con data+ora · incasso residuo con operatore → Cassa</div>
    <div class="wf-box p-4 space-y-2">
        <p>Camera € 360 (pagato) + Extra € 60 (da pagare)</p>
        <select class="wf-input"><option>Parziale — solo extra</option><option>Pagato tutto</option></select>
        <p class="text-sm">Data/ora incasso · Operatore turno</p>
        <button class="wf-btn wf-btn-primary">Conferma</button>
    </div>
</main>
</body></html>
