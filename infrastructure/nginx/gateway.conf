worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    map $uri $response_cache_control {
        default '';
        ~^/api/ 'no-store';
        ~^/admin/ 'no-store';
    }
    server {
        listen 8080;
        client_max_body_size 2m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control $response_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        location = /healthz { access_log off; return 200 'ok'; }
        location = /admin { return 302 /admin/; }
        location = /admin/login/ {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            set $backend http://backend:8000;
            proxy_pass $backend;
        }
        location /admin/ {
            set $backend http://backend:8000;
            proxy_pass $backend;
        }
        location /static/ {
            alias /srv/django-static/;
        }
        location = /api/v1/auth/login/ {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            set $backend http://backend:8000;
            proxy_pass $backend;
        }
        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend;
        }
        location = /api/v1/superadmin/restore/ {
            client_max_body_size 21m;
            set $backend http://backend:8000;
            proxy_pass $backend;
        }
        location / {
            set $frontend http://frontend:8080;
            proxy_pass $frontend;
        }
    }
}
